name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Firestore and Auth emulators run on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      # Spec §7: locked dependencies, no install scripts.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      # Packages build first: the server and web app consume their compiled output.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (Firebase emulators)
        run: npm run test:int -w apps/server
