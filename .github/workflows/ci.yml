name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Firestore and Auth emulators run on the JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      # Spec §7: locked dependencies, no install scripts.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      # Packages build first: the server and web app consume their compiled output.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Not a workspace: the Apps Script example runs in Node against stand-ins for Apps Script and recorded answers.
      - name: Google Sheets example
        run: node --test "examples/google-sheets/test/*.test.mjs"
      - name: Integration tests (Firebase emulators)
        run: npm run test:int -w apps/server

  # The server image as the release workflow builds it, started the way Cloud Run starts it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          tags: ustp-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash apps/server/scripts/smoke-image.sh ustp-server:ci

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      # No backend and no credentials: checks syntax, types and the module's validations against the locked provider.
      - name: Validate each environment
        run: |
          for env in dev staging prod; do
            terraform -chdir="infra/terraform/envs/$env" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/terraform/envs/$env" validate
          done
