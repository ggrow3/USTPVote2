version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      vue-quasar:
        patterns: ["vue", "vue-router", "vue-tsc", "@vitejs/*", "vite", "quasar", "@quasar/*"]
    ignore:
      # vue-tsc 3.x cannot run on TypeScript 7 (it loads typescript/lib/tsc, which 7 no longer exports).
      # Remove once vue-tsc supports TypeScript 7; see the closed PR #1.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The server image's base, pinned by digest (apps/server/Dockerfile). Node stays on the LTS line in .nvmrc.
  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # The Google provider in each environment's .terraform.lock.hcl, in one pull request.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/dev
      - /infra/terraform/envs/staging
      - /infra/terraform/envs/prod
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
